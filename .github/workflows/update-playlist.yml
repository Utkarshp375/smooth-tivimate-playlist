name: Update TiviMate playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build playlist
        run: python scripts/build_playlist.py
      - name: Check stream links
        if: success()
        run: python scripts/check_links.py
        continue-on-error: true
      - name: Fetch EPG
        if: success()
        env:
          EPG_URL: ${{ vars.EPG_URL }}
        run: python scripts/fetch_epg.py
      - name: Commit generated output
        run: |
          if [ -n "$(git status --porcelain output/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/
            git commit -m "chore: refresh playlist and EPG"
            git push
          else
            echo "No generated output changes."
          fi
